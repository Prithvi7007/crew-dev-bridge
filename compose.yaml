name: crew-dev-bridge
services:
  bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 512m
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      CREW_REPO: Prithvi7007/crew_games
      CREW_WORKSPACE: /workspace
      CREW_BRIDGE_WORKSPACE: /bridge-source
      WEDDING_WORKSPACE: /wedding-source
      WEDDING_GITHUB_TOKEN_FILE: /run/crew-secrets/wedding_github_token
      CREW_QUEUE: /queue
      CREW_AUDIT: /audit/events.jsonl
      CREW_GITHUB_TOKEN_FILE: /run/crew-secrets/github_token
    group_add:
      - "986"
    volumes:
      - ./source:/workspace:rw
      - ./bridge-source:/bridge-source:rw
      - ./wedding-source:/wedding-source:rw
      - ./queue:/queue:rw
      - ./secrets:/run/crew-secrets:ro
      - ./audit:/audit:rw
      - /var/lib/crew-dev-bridge/diagnostics:/run/crew-diagnostics:ro
      - /run/crew-ops:/run/crew-ops:ro
      - /run/crew-deploy:/run/crew-deploy:ro
      - /run/crew-maint:/run/crew-maint:ro
      - /run/crew-host-diag:/run/crew-host-diag:ro
      - /run/crew-release:/run/crew-release:ro
  runner:
    image: crew-dev-runner:local
    restart: unless-stopped
    # The supervisor needs only CHOWN/SETUID/SETGID to launch checks under 10002.
    # Untrusted test commands run as 10002:10002, never as the supervisor.
    user: "0:10001"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g,uid=10001,gid=10001
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    init: true
    cpus: 1.0
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./queue:/queue:rw
