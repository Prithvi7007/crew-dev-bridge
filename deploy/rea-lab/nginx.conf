server {
    listen 8080;
    server_name _;
    client_max_body_size 4k;
    proxy_read_timeout 15s;
    proxy_connect_timeout 3s;
    location / {
        proxy_pass http://lab:8766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
    }
}
