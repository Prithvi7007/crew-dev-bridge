name: rea-lite

services:
  rea:
    build:
      context: .
      dockerfile: Dockerfile
    image: rea-lite:6.8.0
    restart: unless-stopped
    # REA HTTP has NO authentication/TLS. Never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:18765:18765"
    networks:
      - rea_isolated
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    init: true
    pids_limit: 128
    mem_limit: 1024m
    cpus: "1.0"
    tmpfs:
      - /tmp:rw,nosuid,size=192m
      - /home/node:rw,nosuid,size=128m,uid=1000,gid=1000,mode=0700
    volumes:
      - ./artifacts:/work/artifacts:ro
      - rea_evidence:/work/evidence
    healthcheck:
      test: ["CMD","node","-e","const s=require('net').connect(18765,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));s.setTimeout(1000,()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

networks:
  rea_isolated:
    driver: bridge
    internal: true

volumes:
  rea_evidence:
