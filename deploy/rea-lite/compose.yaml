name: rea-lite

services:
  rea:
    build:
      context: .
      dockerfile: Dockerfile
    image: rea-lite:6.8.0
    restart: unless-stopped
    # REA 6.8.0 rejects values below 10 MiB. This Compose override also
    # fixes the already-built image without requiring a new image build.
    environment:
      REA_MCP_MAX_RESPONSE_BYTES: "10485760"
    # No published ports on the internal-only network: Docker may silently
    # omit host port mappings for containers attached only to an internal bridge.
    networks:
      - rea_isolated
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    init: true
    pids_limit: 128
    mem_limit: 1024m
    cpus: "1.0"
    tmpfs:
      - /tmp:rw,nosuid,size=192m
      - /home/node:rw,nosuid,size=128m,uid=1000,gid=1000,mode=0700
    volumes:
      - ./artifacts:/work/artifacts:ro
      - rea_evidence:/work/evidence
    healthcheck:
      test: ["CMD","node","-e","const s=require('net').connect(18765,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));s.setTimeout(1000,()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

  ingress:
    # Tiny, unprivileged TCP/HTTP gateway. Only this service publishes localhost.
    # The ingress has a normal bridge for port mapping and a private bridge for REA.
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 64
    mem_limit: 96m
    cpus: "0.25"
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    ports:
      - "127.0.0.1:18765:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rea_access
      - rea_isolated
    depends_on:
      - rea

networks:
  rea_access:
    driver: bridge
  rea_isolated:
    driver: bridge
    internal: true

volumes:
  rea_evidence:
