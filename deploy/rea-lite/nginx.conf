# Private local MCP ingress. No authentication: publication MUST stay on 127.0.0.1.
# The REA container is on an internal Docker network and has NO published ports.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /mcp {
        proxy_pass http://rea:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        return 404;
    }
}
