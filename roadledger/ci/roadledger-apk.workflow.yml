# Template only: a human maintainer must review and install this workflow
# at .github/workflows/roadledger-apk.yml to activate CI builds.
name: RoadLedger Android APK
on:
  pull_request:
    paths:
      - 'roadledger/**'
      - '.github/workflows/roadledger-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: roadledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoadLedger-v0.1-debug-apk
          path: roadledger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
